<!DOCTYPE html>
<html lang="it" translate="no">
<head>
<meta name="google" content="notranslate">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Touch Welness Firma</title>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script src="DeviceSync.js"></script>
<script src="Master_core/Desktop_AuthSync.js"></script>

<style>
  :root {
      --bg-body: #0f172a; --bg-panel: #1e293b; --border-line: #334155;
      --text-main: #f8fafc; --text-muted: #94a3b8;
      --accent: #38bdf8; --green: #10b981; --red: #ef4444;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
      margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-body); color: var(--text-main);
      height: 100vh; display: flex; flex-direction: column; overflow: hidden;
  }

  #idleScreen {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 30px; text-align: center;
  }
  .idle-card {
      background: var(--bg-panel); border: 1px solid var(--border-line);
      border-radius: 20px; padding: 40px; max-width: 480px; width: 100%;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
  }

  #docScreen {
      flex: 1; display: none; flex-direction: column; height: 100vh; overflow: hidden; background: #ffffff; color: #0f172a;
  }
  .doc-scroll-area {
      flex: 1; overflow-y: auto; padding: 25px 30px 40px 30px;
  }
  .signature-section {
      margin-top: 30px; padding: 20px; border: 2px solid #38bdf8; border-radius: 12px;
      background: #f8fafc; text-align: center;
  }
  .signature-section h4 {
      margin: 0 0 12px 0; color: #0f172a; font-size: 16px; font-weight: 900;
  }
  .canvas-wrapper {
      position: relative; width: 100%; max-width: 850px; height: 260px;
      margin: 0 auto; background: #ffffff; border: 2px dashed #cbd5e1; border-radius: 8px;
      touch-action: none;
  }
  canvas#sigCanvas {
      width: 100%; height: 100%; display: block; cursor: crosshair; touch-action: none;
  }
  .btn-clear-sig {
      margin-top: 10px; background: transparent; border: 1px solid #94a3b8; color: #475569;
      padding: 6px 14px; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer;
  }

  .bottom-action-bar {
      background: #0f172a; padding: 12px 20px; display: flex; gap: 15px;
      border-top: 1px solid #334155; flex-shrink: 0;
  }
  .btn-tablet {
      flex: 1; padding: 16px; border-radius: 10px; font-size: 14px; font-weight: 900;
      text-transform: uppercase; cursor: pointer; display: flex; align-items: center;
      justify-content: center; gap: 8px; border: none; transition: 0.2s;
  }
  .btn-cancel {
      background: #1e293b; color: #f8fafc; border: 1px solid #334155;
  }
  .btn-submit {
      background: var(--green); color: #ffffff;
  }
</style>
</head>
<body>

<div id="idleScreen">
    <div class="idle-card">
        <div style="width:70px; height:70px; border-radius:50%; background:rgba(56,189,248,0.12); display:flex; align-items:center; justify-content:center; margin:0 auto 20px auto;">
            <i class="material-icons-round" style="font-size:38px; color:var(--accent);">draw</i>
        </div>
        <h2 style="margin:0 0 10px 0; font-size:22px; text-transform:uppercase;">Terminale Firma Pronta</h2>
        <p id="idleStatusText" style="color:var(--text-muted); font-size:14px; line-height:1.6; margin:0;">
            In attesa dell'invio del modulo privacy dalla postazione Reception...
        </p>
    </div>
</div>

<div id="docScreen">
    <div class="doc-scroll-area" id="docScrollContainer">
        <div id="contractContent"></div>

        <div class="signature-section">
            <h4>Apponi la tua Firma</h4>
            <div class="canvas-wrapper">
                <canvas id="sigCanvas"></canvas>
            </div>
            <button type="button" class="btn-clear-sig" onclick="window.clearSignature()">PULISCI FIRMA</button>
        </div>
    </div>

    <div class="bottom-action-bar">
        <button type="button" class="btn-tablet btn-cancel" onclick="window.cancelTabletSignature()">
            ANNULLA
        </button>
        <button type="button" class="btn-tablet btn-submit" onclick="window.submitTabletSignature()">
            <i class="material-icons-round" style="font-size:18px;">check_circle</i> INVIA ALLA RECEPTION
        </button>
    </div>
</div>

<script>
    let tabletRef = null;
    let currentAppId = null;
    let isDrawing = false;
    let hasSigned = false;
    let canvas, ctx;

    async function resolveStructureId() {
        const urlParams = new URLSearchParams(window.location.search);
        const codeParam = urlParams.get('code');
        if (codeParam && typeof firebase !== 'undefined') {
            try {
                const snap = await firebase.database().ref(`MASTER_ADMIN_DB/firma_links/${codeParam}`).once('value');
                if (snap.val()) {
                    localStorage.setItem('tw_structure_id', snap.val());
                    return snap.val();
                }
            } catch (e) { console.error("Errore risoluzione codice firma:", e); }
        }
        return urlParams.get('struct') || localStorage.getItem('tw_structure_id') || window.twStructId;
    }

    function initSignaturePad() {
        canvas = document.getElementById('sigCanvas');
        if (!canvas) return;
        ctx = canvas.getContext('2d');
        resizeCanvas();

        const startDraw = (e) => {
            isDrawing = true;
            hasSigned = true;
            const pos = getPos(e);
            ctx.beginPath();
            ctx.moveTo(pos.x, pos.y);
            e.preventDefault();
        };
        const moveDraw = (e) => {
            if (!isDrawing) return;
            const pos = getPos(e);
            ctx.lineTo(pos.x, pos.y);
            ctx.strokeStyle = "#0f172a";
            ctx.lineWidth = 2.5;
            ctx.lineCap = "round";
            ctx.lineJoin = "round";
            ctx.stroke();
            e.preventDefault();
        };
        const endDraw = () => { isDrawing = false; };

        canvas.addEventListener('mousedown', startDraw);
        canvas.addEventListener('mousemove', moveDraw);
        window.addEventListener('mouseup', endDraw);

        canvas.addEventListener('touchstart', startDraw, { passive: false });
        canvas.addEventListener('touchmove', moveDraw, { passive: false });
        window.addEventListener('touchend', endDraw);
    }

    function resizeCanvas() {
        if (!canvas) return;
        const rect = canvas.parentElement.getBoundingClientRect();
        canvas.width = rect.width || 850;
        canvas.height = rect.height || 260;
    }

    function getPos(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return {
            x: clientX - rect.left,
            y: clientY - rect.top
        };
    }

    window.clearSignature = function() {
        if (!ctx || !canvas) return;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        hasSigned = false;
    };

    function bindCheckboxes() {
        const container = document.getElementById('contractContent');
        if (!container) return;
        const boxes = container.querySelectorAll('input[type="checkbox"]');
        boxes.forEach(cb => {
            cb.addEventListener('change', function() {
                if (this.checked) {
                    this.setAttribute('checked', 'checked');
                } else {
                    this.removeAttribute('checked');
                }
            });
        });
    }

    window.cancelTabletSignature = function() {
        if (!tabletRef) return;
        tabletRef.update({
            status: 'cancelled',
            cancelledAt: Date.now()
        }).then(() => {
            showIdleUI();
        });
    };

    window.submitTabletSignature = function() {
        if (!tabletRef) return;
        if (!hasSigned) {
            alert("Per favore, apponi la firma nell'apposito riquadro prima di inviare.");
            return;
        }

        const container = document.getElementById('contractContent');
        const boxes = container.querySelectorAll('input[type="checkbox"]');
        boxes.forEach(cb => {
            if (cb.checked) cb.setAttribute('checked', 'checked');
            else cb.removeAttribute('checked');
        });

        const updatedHtml = container.innerHTML;
        const sigDataUrl = canvas.toDataURL('image/png');

        tabletRef.update({
            status: 'review',
            docs: [{ content: updatedHtml }],
            signature: sigDataUrl
        });
    };

    function showIdleUI() {
        document.getElementById('docScreen').style.display = 'none';
        document.getElementById('idleScreen').style.display = 'flex';
        window.clearSignature();
    }

    function showDocUI(htmlContent) {
        document.getElementById('idleScreen').style.display = 'none';
        document.getElementById('docScreen').style.display = 'flex';
        document.getElementById('contractContent').innerHTML = htmlContent;
        bindCheckboxes();
        setTimeout(() => {
            resizeCanvas();
            window.clearSignature();
            document.getElementById('docScrollContainer').scrollTop = 0;
        }, 80);
    }

    async function startTabletListener() {
        if (typeof firebase === 'undefined') {
            setTimeout(startTabletListener, 400);
            return;
        }
        const structId = await resolveStructureId();
        if (!structId) {
            document.getElementById('idleStatusText').innerText = "Codice struttura non rilevato. Apri il link generato dalle Impostazioni Firma.";
            return;
        }

        tabletRef = firebase.database().ref(`MASTER_ADMIN_DB/structures_data/${structId}/device_sync/tablet`);
        tabletRef.on('value', snap => {
            const data = snap.val();
            if (data && data.status === 'pending' && data.docs && data.docs[0]) {
                currentAppId = data.appId;
                showDocUI(data.docs[0].content);
            } else if (!data || data.status === 'idle' || data.status === 'completed' || data.status === 'cancelled') {
                showIdleUI();
            }
        });

        window.addEventListener('beforeunload', () => {
            if (document.getElementById('docScreen').style.display === 'flex' && tabletRef) {
                tabletRef.update({ status: 'cancelled' });
            }
        });
    }

    window.addEventListener('DOMContentLoaded', () => {
        initSignaturePad();
        startTabletListener();
    });
</script>
</body>
</html>
